name: CI

# blastradius-mcp targets the two active Node.js LTS lines:
#   22.x — "Jod", Maintenance LTS
#   24.x — "Krypton", Active LTS
# Node 20 reached end-of-life on 2026-04-30 and is not tested. Node 18 and
# below are unsupported.
#
# Node 20 is excluded regardless: `npm run test:src` shells out to
# `node --test dist/tests/**/*.test.js`, and that glob is expanded by Node's own
# test runner, which requires Node >= 22.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Caches the npm cache directory, keyed on package-lock.json.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Builds, then runs the compiled suite with the built-in Node test runner.
      # Prefer this over `npm test`: `test` assumes dist/ already exists.
      - name: Test
        run: npm run test:src

      - name: Print Node.js version
        run: node --version
